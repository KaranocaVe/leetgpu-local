name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_gpu_smoke:
        description: "Run the CUDA runtime smoke test on a self-hosted GPU runner"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LEETGPU_CI_UPSTREAM: e6579a64e20e30d63f8cc18c79d59d3c95588db1
  UV_VERSION: "0.12.15"

jobs:
  static:
    name: uv / Python / repository checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Generate lockfile
        run: uv lock
      - name: Commit generated lockfile
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          if git diff --quiet -- uv.lock && git ls-files --error-unmatch uv.lock >/dev/null 2>&1; then
            echo "uv.lock is already committed and current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "build: add uv lockfile"
          git push origin HEAD:"$GITHUB_HEAD_REF"
      - name: Verify lockfile
        run: uv lock --check
      - name: Compile Python helpers through uv
        run: uv run --locked python -m py_compile tools/*.py
      - name: Check CMake preset JSON
        run: uv run --locked python -m json.tool CMakePresets.json >/dev/null

  cuda-compile:
    name: Configure + compile all CUDA starters
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:13.4.1-devel-ubuntu24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates cmake git ninja-build python3
          rm -rf /var/lib/apt/lists/*
      - name: Toolchain versions
        run: |
          nvcc --version
          cmake --version
          ninja --version
          uv --version
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLEETGPU_UPSTREAM_TAG="$LEETGPU_CI_UPSTREAM" \
            -DLEETGPU_CUDA_ARCHITECTURES=75 \
            -DLEETGPU_ENABLE_TESTS=OFF
      - name: Validate generated workspace and compile database
        run: |
          python3 tools/validate_configure.py \
            --upstream build/_deps/leetgpu_challenges-src \
            --source . \
            --build build
      - name: Compile every CUDA starter
        run: cmake --build build --target leetgpu-all --parallel 2

  gpu-smoke:
    name: Runtime harness smoke test
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_gpu_smoke }}
    runs-on: [self-hosted, linux, x64, gpu]
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Sync locked GPU environment
        run: uv sync --locked --extra gpu
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLEETGPU_UPSTREAM_TAG="$LEETGPU_CI_UPSTREAM" \
            -DLEETGPU_CUDA_ARCHITECTURES=native \
            -DLEETGPU_ENABLE_TESTS=ON
      - name: Install known-good Vector Add fixture
        run: cp tests/fixtures/vector_add_solution.cu solutions/easy/1_vector_add/solution.cu
      - name: Run official Vector Add functional cases through local harness
        run: cmake --build build --target check_easy_1_vector_add
