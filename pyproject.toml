[project]
name = "leetgpu-local"
version = "0.1.0"
description = "Local CUDA development harness for LeetGPU"
requires-python = ">=3.13,<3.14"
dependencies = []

[project.optional-dependencies]
gpu = [
    "torch>=2.11.0,<3",
]

[tool.uv]
package = false
required-version = ">=0.12.15,<0.13"

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
